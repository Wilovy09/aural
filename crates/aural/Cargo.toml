[package]
name = "aural"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aural"
path = "src/main.rs"

[dependencies]
freya.workspace = true
freya-winit.workspace = true
# The Skia Freya renders with, for the mesh the backdrop warps (not re-exported by Freya).
skia-safe = { package = "freya-skia-safe", version = "=0.100.0-beta.1" }
log.workspace = true
anyhow.workspace = true
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { workspace = true, features = ["net", "macros"] }
rodio.workspace = true
ytmusic.workspace = true
motion.workspace = true
lyrics.workspace = true
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
mdns-sd = "0.21.5"
gethostname = "1.1.0"
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
android_logger.workspace = true
jni = "0.21"
# QuickJS ships no pregenerated bindings for Android; generate them at build time.
rquickjs = { version = "0.12", features = ["bindgen"] }

# Nor for iOS.
[target.'cfg(target_os = "ios")'.dependencies]
rquickjs = { version = "0.12", features = ["bindgen"] }
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "UIApplication",
  "UIGeometry",
  "UIResponder",
  "UIScreen",
  "UIView",
  "UIWindow",
] }

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger.workspace = true
dirs = "6"
webview.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSImage",
  "NSResponder",
] }
