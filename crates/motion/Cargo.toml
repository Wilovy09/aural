[package]
name = "motion"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bytes = "1"
log.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
tokio = { workspace = true, features = ["time"] }
unicode-normalization = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["media", "api-level-28"] }
ndk-sys = "0.6"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "AVAsset",
  "AVAssetReader",
  "AVAssetReaderOutput",
  "AVAssetTrack",
  "AVMediaFormat",
  "objc2-core-media",
  "objc2-core-video",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
  "std",
  "CMBase",
  "CMSampleBuffer",
  "CMTime",
  "objc2-core-video",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
  "std",
  "CVBase",
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVReturn",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSDictionary",
  "NSError",
  "NSString",
  "NSURL",
  "NSValue",
] }
